<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLI 班级管理</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e2dc;--acc:#b4232c;--acc2:#fbe9ea;--ok:#1f7a4d;--okb:#e5f4ec;--warn:#9a5b00;--warnb:#fff3db;--blue:#2457a6;--blueb:#e8effa;
--sA1:#e9a23b;--sA2:#d9683a;--sC5G:#5a8f3d;--sC5T:#2f7d6b;--sC6:#3f6fb5;--sC7:#6a4fb0;--sP1:#c2477a;--sP2:#9b3f9e;--sP3:#5b3c8f;--sX:#888}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#212226;--ink:#e8e6e3;--mut:#9aa0a6;--line:#34363b;--acc:#ff6b73;--acc2:#3a2225;--okb:#1d3329;--ok:#6fd19c;--warnb:#3a2f17;--warn:#f0b54d;--blue:#8db4ff;--blueb:#1f2a3f}}
:root[data-theme="dark"]{--bg:#17181a;--card:#212226;--ink:#e8e6e3;--mut:#9aa0a6;--line:#34363b;--acc:#ff6b73;--acc2:#3a2225;--okb:#1d3329;--ok:#6fd19c;--warnb:#3a2f17;--warn:#f0b54d;--blue:#8db4ff;--blueb:#1f2a3f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header img{height:34px}
header h1{font-size:17px;margin:0;font-weight:700}
header .sub{color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button,.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;font-size:13px}
nav button.on,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
main{max-width:1280px;margin:0 auto;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.grid4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.kpi b{font-size:22px;display:block}
.kpi .l{font-weight:700}
.kpi small{color:var(--mut)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;background:var(--card);position:sticky;top:0}
tr.click{cursor:pointer}tr.on td{background:var(--acc2)}
tr.click:hover td{background:var(--acc2)}
.tag{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;line-height:20px;background:var(--bg);border:1px solid var(--line)}
.st{color:#fff;border:none}
.t-ok{background:var(--okb);color:var(--ok);border-color:transparent}
.t-w{background:var(--warnb);color:var(--warn);border-color:transparent}
.t-b{background:var(--blueb);color:var(--blue);border-color:transparent}
.t-r{background:var(--acc2);color:var(--acc);border-color:transparent}
.fr{color:var(--blue);font-weight:700}
.zh{color:var(--acc);font-weight:700}
.mut{color:var(--mut)}
.small{font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:120px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.f>*{color:var(--ink);font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.wds{display:flex;gap:4px;flex-wrap:wrap}
.wds .chip{min-width:34px;text-align:center;padding:5px 6px}
.wdc{display:inline-block;min-width:18px;text-align:center;font-weight:700;border-bottom:2px solid;margin-right:2px;line-height:18px}
.tg{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-left:2px;vertical-align:1px}
.wds .chip.f{background:var(--blue);border-color:var(--blue);color:#fff}
/* gantt */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.g{position:relative}
.gh{display:flex;position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--line);height:26px}
.gh .lab,.gr .lab{position:sticky;left:0;background:var(--card);z-index:4;width:150px;min-width:150px;border-right:1px solid var(--line);padding:4px 8px;font-size:12px}
.gm{position:absolute;top:0;height:26px;border-left:1px solid var(--line);font-size:11px;color:var(--mut);padding:5px 4px}
.gr{display:flex;height:34px;border-bottom:1px solid var(--line);cursor:pointer}
.gr:hover .lab{background:var(--acc2)}
.gr .lab b{display:block;font-size:12.5px;line-height:14px}
.gr .lab span{font-size:11px;color:var(--mut)}
.gt{position:relative;flex:none}
.bar{position:absolute;top:7px;height:20px;border-radius:5px;color:#fff;font-size:11px;line-height:20px;padding:0 4px;overflow:hidden;white-space:nowrap;opacity:.92}
.bar.past{opacity:.38}
.mk{position:absolute;top:2px;width:0;height:30px;z-index:2}
.mk i{position:absolute;left:-6px;top:0;font-style:normal;font-size:12px;line-height:12px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:2;pointer-events:none}
.gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);align-items:center}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:3px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.mbg.on{display:flex}
.modal{background:var(--bg);border-radius:14px;max-width:980px;width:100%;padding:16px;position:relative}
.modal .x{position:absolute;right:12px;top:10px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:10px 0}
.sc{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card);border-top:4px solid var(--sX)}
.sc.cur{box-shadow:0 0 0 2px var(--acc)}
.sc h4{margin:0 0 4px;font-size:14px}
.sc div{font-size:12px}
.sess{columns:3 260px;column-gap:16px;font-size:12.5px}
.sess .ss{break-inside:avoid;margin-bottom:10px}
.sess .ss h5{margin:0 0 3px;font-size:13px}
.sess .li{display:flex;gap:6px;padding:1px 0}
.sess .li .n{width:22px;color:var(--mut);text-align:right}
.sess .li .d{width:84px}
.sess .li span:nth-child(3){min-width:44px}
.sess .li.past{opacity:.5}
.sess .li.ex{font-weight:700}
.warnbox{background:var(--warnb);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.note{color:var(--mut);font-size:12px}
@media(max-width:640px){main{padding:12px}header{padding:8px 12px}nav{margin-left:0}.gh .lab,.gr .lab{width:96px;min-width:96px}}
#printArea{display:none}@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important;font-size:12px;color:#000}#printArea .pt{border-collapse:collapse;width:100%;margin-bottom:12px}#printArea .pt td,#printArea .pt th{border:1px solid #999;padding:4px 6px;text-align:left}#printArea .pg{column-count:3;column-gap:14px}#printArea .pst{break-inside:auto;margin-bottom:10px}#printArea .psh{font-weight:700;border-bottom:2px solid #333;margin-bottom:2px;break-after:avoid}#printArea .psr{display:grid;grid-template-columns:22px 1fr auto;gap:4px;padding:1px 0;border-bottom:1px solid #eee;break-inside:avoid}#printArea .pex{font-weight:700;color:#b00}@page{margin:12mm}}
@media print{header,nav,.noprint{display:none!important}.mbg{position:static;background:none;padding:0}.modal{max-width:none}}
</style>
</head>

const ISO=t=>new Date(t).toISOString().slice(0,10);
const DAY=864e5;
const wdOf=s=>(new Date(P(s)).getUTCDay()+6)%7; // 0=一
const addD=(s,n)=>ISO(P(s)+n*DAY);
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const TODAY=today();
const md=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8)):'—';
const mdw=s=>s?md(s)+'('+CN[wdOf(s)]+')':'—';
const wdStr=a=>a.map(i=>CN[i]).join('');
const isIntl=c=>c.cat.includes('国际');
const isWest=c=>c.cat.includes('加西');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// ---- core calc ----
const monday=d=>addD(d,-wdOf(d));
function cdays(c){
 const hol=new Set([...CFG.hol,...(isWest(c)?CFG.holW:[]),...(c.off||[])]);
 const wd=new Set(c.wd);
 const next=(d,incl)=>{let x=incl?d:addD(d,1),g=0;while(!(wd.has(wdOf(x))&&!hol.has(x))){x=addD(x,1);if(++g>800)return null}return x};
 return {hol,wd,next};
}
function calc(c){
 const path=pathOf(c);
 let i0=path.indexOf(c.stage); if(i0<0)i0=0;
 let iL=c.last?path.indexOf(c.last):path.length-1; if(iL<i0)iL=i0;
 const fr=new Set(c.fr||[]);
 const out=[]; let d=c.start;
 if(!d||!c.wd.length) return out;
 const {next:nx0}=cdays(c);
 const used=new Set(), stOv=c.stOv||{};
 const reserved=new Set(Object.values(stOv));
 let curStart=null;
 const next=(x,incl)=>{let y=nx0(x,incl),g=0;while(y&&(used.has(y)||(reserved.has(y)&&y!==curStart))){y=nx0(y);if(++g>400)return null}return y};
 d=next(d,true);
 for(let i=i0;i<=iL&&d;i++){
  const k=path[i], cf=CFG.st[k];
  if(stOv[k]){curStart=stOv[k];d=nx0(stOv[k],true);} const a0=k==='A1'?(+c.a0||3):3; const n=(c.sOv&&c.sOv[k])||((k==='A2'&&isNew(c)?(cf.sNew||37):cf.s)+a0-3);
  const ov=(c.exOv&&c.exOv[k])||{};
  const ss=[];
  for(let j=0;j<n&&d;j++){ss.push({d,i:j+1,f:fr.has(wdOf(d))});used.add(d);if(j<n-1)d=next(d)}
  const noMid=!!(cf.noMid&&c.coh>=CFG.noMidFrom);
  const newA1=k==='A1'&&noMid;
  let plan=null,anchor=null;
  if(newA1){
   // 新版 A1：29 个连续上课日 = A0 3 堂 + 内容课 + (全日 Bilan+期末 / 兼读 期末)；内容课依星期归中教或外教
   const full=c.ft,N=ss.length,exN=full?2:1;let z=0,w=0;
   ss.forEach((x,j)=>{
    if(j<a0){x.lab='A0-'+(j+1);x.a0=1;return}
    if(j>=N-exN){x.lab=(x.f?'外':'中')+'·'+(j===N-1?'期末':'Bilan');return}
    if(x.f){w++;x.lab='外'+w;x.wi=w}else{z++;x.lab='中'+z;x.zi=z}
   });
   plan={z,w,needZ:full?15:17,needW:full?9:8,full,std:N===cf.s+a0-3};
   anchor=ss.find(x=>x.wi===(full?6:5));
  }
  let mid=null,midHome=false;
  if(cf.mid){
   if(noMid){ if(newA1&&ss.length>a0){mid=ov.mid||(anchor?anchor.d:ss[Math.min(cf.mid,ss.length)-1].d);midHome=true}
    else if(k==='A2'&&ss.length){const zs=ss.filter(x=>!x.f);const z11=(c.fr||[]).length&&zs.length>=11?zs[10]:null;mid=ov.mid||(z11?z11.d:ss[Math.ceil(ss.length/2)-1].d);midHome=true} }
   else mid=ov.mid||(ss[cf.mid-1]?ss[cf.mid-1].d:null);
  }
  if(mid&&!midHome){const x=ss.find(x=>x.d===mid);if(x)x.m='期中'}
  if(cf.bilan&&ss.length>=2&&(!newA1||c.ft)) ss[ss.length-2].m='Bilan';
  let autoFin=cf.fin?ss.slice(-cf.fin).map(x=>x.d):[];
  // 分科：每位老师在本阶段的最后一堂考自己负责的科目
  if(cf.fin>=2&&ss.length){const sks=[...new Set(c.tch.filter(t=>t.sk&&tAct(t,ss[ss.length-1].d)).map(t=>t.sk))];
   if(sks.length>=2){const ds=sks.map(sk=>{for(let j=ss.length-1;j>=0;j--){if(tOfDay(c,wdOf(ss[j].d),ss[j].d).some(t=>t.sk===sk))return ss[j].d}return null}).filter(Boolean);if(ds.length)autoFin=[...new Set(ds)].sort();}}
  const fin=ov.fin&&ov.fin.length?ov.fin.slice():autoFin;
  fin.forEach(dd=>{const x=ss.find(y=>y.d===dd);if(x)x.m='期末'});
  const nF=ss.filter(x=>x.f).length;
  out.push({k,n:cf.n,start:ss[0]&&ss[0].d,end:ss.length&&ss[ss.length-1].d,cnt:ss.length,nF,nZ:ss.length-nF,mid,midHome,fin,ss,noMid:noMid&&!midHome,plan,ovMid:!!ov.mid,ovFin:!!(ov.fin&&ov.fin.length),last:i===path.length-1||k===path[path.length-1]});
  d=d&&next(d);
 }
 return out;
}
const midStr=s=>s.mid?(s.midHome?mdw(s.mid)+' 当周（居家）':mdw(s.mid)):(s.noMid?'无期中':'—');
function info(c){
 const S=calc(c); const first=S[0],last=S[S.length-1];
 let cur=S.find(s=>s.start<=TODAY&&TODAY<=s.end)||null;
 let st='进行中';
 if(!first) st='资料不全';
 else if(first.start>TODAY) {st='即将开课';cur=first}
 else if(last.end<TODAY) {st='已结课';cur=last}
 else if(!cur){cur=S.find(s=>s.start>TODAY)||last;}
 const nxt=cur?S[S.indexOf(cur)+1]:null;
 const warns=[];
 if(c.sheetEnd&&first&&first.end!==c.sheetEnd) warns.push(`课表写本阶段 ${md(c.sheetEnd)} 结束，计算为 ${md(first.end)}${first.end<c.sheetEnd?'（可能有停课/请假未录入）':''}`);
 if(c.aligned) warns.push(`本阶段课表结课日为 ${md(c.sheetEnd)}：标准 ${c.aligned.std} 次课，课表实际 ${c.aligned.n} 次（已依课表计算，可能含停课、补课或并班）`);
 if(c.unset) warns.push('外教上课日未设定，中教/外教次数无法分开计算');
 c.tch.filter(t=>INACT.includes(t.id)).forEach(t=>warns.push(`课表仍排 ${t.n}（目前不合作），请确认代课老师`));
 const cad=cadence(c,cur);
 const a1=S.find(s=>s.plan);
 if(a1&&a1.plan.std&&!c.unset&&(c.fr||[]).length&&(c.fr||[]).length<c.wd.length&&a1.end>=TODAY){const p=a1.plan;
  if(p.z<p.needZ) warns.push(`A1 中教新知识只有 ${p.z} 堂（需 ${p.needZ}），因假期/停课落在中教日；请把最后 ${p.needZ-p.z} 堂外教课改给中教`);
  else if(p.w<p.needW) warns.push(`A1 外教口语 ${p.w} 堂（标准 ${p.needW}），中教多 ${p.z-p.needZ} 堂`);}
 if(cad.w) warns.push(cad.w);
 return {S,cur,nxt,st,first,last,warns,cad};
}
function cadence(c,cur){
 const n=c.wd.length,f=(c.fr||[]).filter(x=>c.wd.includes(x)).length;
 if(c.unset) return {t:'—'};
 if(isIntl(c)||f===n) return {t:'全外教'};
 if(f===0) return {t:'全中教'};
 const t=`${n-f}中+${f}外`;
 let w='';
 if(cur&&['A1','A2'].includes(cur.k)){
  if(c.ft&&!(n===5&&f===2)) w=`全日班一般为 3中+2外，目前设定是 ${t}`;
  if(!c.ft&&!(n===3&&f===1)) w=`兼读班一般为 2中+1外，目前设定是 ${t}`;
 }
 return {t,w};
}

}

const ZHCOL='#1a8a55';const TCOL=['#2563c9','#c0392b','#b8730a','#8a44b8','#0b8a95','#c2477a'];
const tcol=(c,t)=>{if(t.zh)return ZHCOL;const f=[...new Set(c.tch.filter(x=>!x.zh).map(x=>x.id))];return TCOL[Math.max(0,f.indexOf(t.id))%TCOL.length];};
const tAct=(t,d)=>(!t.from||d>=t.from)&&(!t.to||d<=t.to);
function tOfDay(c,i,d){d=d||TODAY;const L=c.tch.filter(t=>tAct(t,d));let a=L.filter(t=>t.d&&t.d.includes(i));if(!a.length)a=L.filter(t=>!t.d||!t.d.length);return a;}

function allEvents(){

  s.fin.forEach((d,i)=>ev.push({d,t:s.fin.length>1?`期末 ${i+1}/${s.fin.length}`:'期末',c,s}));
  ev.push({d:s.start,t:'开始',c,s,tr:1});

let EDT={};
function tKnown(){const m={};CLS.forEach(c=>c.tch.forEach(t=>{if(t.n&&!m[t.n])m[t.n]={id:t.id,zh:!!t.zh}}));return m}
function tchRows(pfx,L){EDT[pfx]=L;const names=[...new Set([...allTeachers(),...Object.keys(tKnown())])].sort((a,b)=>a.localeCompare(b));
 return `<datalist id="${pfx}tnames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`+(L.length?`<div class="tw"><table><tr><th>老师</th><th>中/外</th><th>上课日</th><th>从</th><th>到</th><th>分科</th><th></th></tr>${L.map((t,i)=>`<tr${t.to&&t.to<TODAY?' style="opacity:.55"':''}>
 <td><input id="${pfx}tn${i}" list="${pfx}tnames" value="${esc(t.n||'')}" style="width:130px" onchange="tAuto('${pfx}',${i})"></td>
 <td><select id="${pfx}tz${i}"><option value="1" ${t.zh?'selected':''}>中教</option><option value="0" ${!t.zh?'selected':''}>外教</option></select></td>
 <td><input id="${pfx}td${i}" value="${wdStr(t.d||[])}" placeholder="一三五" style="width:80px"></td>
 <td><input type="date" id="${pfx}tf${i}" value="${t.from||''}"></td><td><input type="date" id="${pfx}tt${i}" value="${t.to||''}"></td>
 <td><select id="${pfx}sk${i}"><option value="">不分科</option>${['CO+EO','CE+EE','CO+CE','EE+EO'].map(v=>`<option ${t.sk===v?'selected':''}>${v}</option>`).join('')}</select></td>
 <td><button type="button" class="btn sm" title="删除" onclick="delT('${pfx}',${i})">✕</button></td></tr>`).join('')}</table></div>`:'<p class="mut small">还没有老师</p>');}
function readT(pfx){const K=tKnown();return (EDT[pfx]||[]).map((t,i)=>{const g=k=>document.getElementById(pfx+k+i);if(!g('tn'))return t;
 const n=g('tn').value.trim();const d=[...g('td').value].map(ch=>CN.indexOf(ch)).filter(x=>x>=0&&x<7);
 const id=t.n===n&&t.id?t.id:(K[n]?K[n].id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('t'+i));
 const o={id,n,zh:g('tz').value==='1',d:[...new Set(d)].sort()};
 if(g('tf').value)o.from=g('tf').value;if(g('tt').value)o.to=g('tt').value;if(g('sk').value)o.sk=g('sk').value;return o})}
function addT(pfx){const L=readT(pfx);L.push({n:'',zh:false,d:[]});document.getElementById(pfx+'tch').innerHTML=tchRows(pfx,L)}
function delT(pfx,i){const L=readT(pfx);L.splice(i,1);document.getElementById(pfx+'tch').innerHTML=tchRows(pfx,L)}
function tAuto(pfx,i){const n=document.getElementById(pfx+'tn'+i).value.trim();const k=tKnown()[n];if(k)document.getElementById(pfx+'tz'+i).value=k.zh?'1':'0'}
function cyc(b,pfx){
 const isI=document.getElementById(pfx+'cat').value.includes('国际');
 if(!b.classList.contains('on')&&!b.classList.contains('f')){b.classList.add(isI?'f':'on')}
 else if(b.classList.contains('on')){b.classList.remove('on');b.classList.add('f')}
 else b.classList.remove('f');
 if(pfx==='n_') calcNew();
}
function normDate(s,ref){
 s=s.trim();if(!s)return null;
 let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
 m=s.match(/^(\d{1,2})[\/.\-月](\d{1,2})日?$/);if(m){let y=+(ref||TODAY).slice(0,4);let d=`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;if(ref&&d<ref)d=`${y+1}`+d.slice(4);return d}
 return null;
}
function readEd(pfx,base){
 const g=id=>document.getElementById(pfx+id);
 const wd=[],fr=[];g('wds').querySelectorAll('.chip').forEach(b=>{const i=+b.dataset.i;if(b.classList.contains('on'))wd.push(i);if(b.classList.contains('f')){wd.push(i);fr.push(i)}});
 wd.sort();fr.sort();
 const start=g('start').value;
 const off=g('off').value.split(/[\n,，、]+/).map(s=>normDate(s,start)).filter(Boolean);
 const c=Object.assign({},base,{code:g('code').value.trim(),cat:g('cat').value,ft:g('ft').value==='1',coh:g('coh').value||start,stage:g('stage').value,start,last:g('last').value,a0:+g('a0').value||3,wd,fr,off,note:g('note').value,unset:false});
 const path=pathOf(c); if(!path.includes(c.stage))c.stage=path[0]; if(!path.includes(c.last))c.last=path[path.length-1];
 if(isIntl(c)) c.fr=c.wd.slice();
 if(document.getElementById(pfx+'tch')) c.tch=readT(pfx).filter(t=>t.n);
 return c;
}

 <div class="stages">${I.S.map(s=>`<div class="sc ${I.cur===s&&I.st==='进行中'?'cur':''}" style="border-top-color:${color(s.k)}"><h4>${s.n}</h4>

 <p class="note">全程预计 ${mdw(I.S[0].start)} → <b>${mdw(I.last.end)}</b>，共 ${I.S.reduce((a,s)=>a+s.cnt,0)} 次课。假期已自动跳过${isWest(c)?'（含加西 9/30、11/11）':''}。</p>

 <details><summary style="cursor:pointer;font-weight:600;margin:6px 0">逐堂课表</summary><div class="sess">${I.S.map(s=>`<div class="ss"><h5 style="color:${color(s.k)}">${s.n}</h5>${s.ss.map(x=>`<div class="li ${x.d<TODAY?'past':''} ${x.m?'ex':''}"><span class="n">${x.i}</span><span class="d">${mdw(x.d)}</span>${mx(c,s)&&!c.unset?`<span class="${x.a0?'mut':x.f?'fr':'zh'}">${x.lab||(x.f?'外':'中')}</span>`:''}${(()=>{const a=tOfDay(c,wdOf(x.d),x.d);return a.length===1?`<span style="color:${tcol(c,a[0])};font-size:11.5px">${esc(a[0].n)}</span>`:''})()}${x.m?`<span class="tag ${x.m==='Bilan'?'t-b':'t-r'}">${x.m}</span>`:''}</div>`).join('')}</div>`).join('')}</div></details>`;
}

 <div class="pg">${I.S.map(s=>`<div class="pst"><div class="psh">${s.n}</div>${s.ss.map(x=>{const e=exm(s,x);return `<div class="psr${e?' pex':''}"><span>${x.i}</span><span>${x.d.slice(0,4)}/${mdw(x.d)}</span><span>${e}</span></div>`}).join('')}</div>`).join('')}</div>

 const done=()=>{document.body.classList.remove('printing');document.title=t0;window.removeEventListener('afterprint',done)};

 const b=[['阶段','第几堂','日期','星期',...(RPLAIN?[]:['中/外']),'考试'],...I.S.flatMap(s=>s.ss.map(x=>[s.n,x.i,x.d,CN[wdOf(x.d)],...(RPLAIN?[]:[mixed(c,s)&&!c.unset?(x.lab||(x.f?'外':'中')):'']),x.m||(s.midHome&&x.d===s.mid?'期中（居家）当周':'')]))];
 const wb=XLSX.utils.book_new();const w1=XLSX.utils.aoa_to_sheet(a);w1['!cols']=[{wch:12},{wch:12},{wch:12},{wch:6},{wch:22},{wch:24}];

function chgEx(id,k,type){
 const c=CLS.find(x=>x.id===id); if(!c)return;
 const s=calc(c).find(x=>x.k===k);
 const cur=type==='mid'?(s&&s.mid?s.mid:''):(s?s.fin.join(', '):'');
 const v=prompt(type==='mid'?`新的期中日期（如 11/20；居家期中填该周任一天）\n留空＝恢复自动计算`:`新的期末日期，两天考请用逗号分开（如 11/20, 11/23）\n留空＝恢复自动计算`,cur);
 if(v===null)return;
 c.exOv=c.exOv||{};c.exOv[k]=c.exOv[k]||{};
 const ds=v.split(/[,，、\s]+/).map(x=>normDate(x,s&&s.start)).filter(Boolean).sort();
 if(type==='mid'){ if(ds.length) c.exOv[k].mid=ds[0]; else delete c.exOv[k].mid; }
 else { if(ds.length) c.exOv[k].fin=ds; else delete c.exOv[k].fin; }
 save(); openC(id); render();
}

const JOURS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function frDate(d){const day=+d.slice(8);return `${JOURS[wdOf(d)]} ${day===1?'1er':day} ${MOIS[+d.slice(5,7)-1]} ${d.slice(0,4)}`}
function frDates(a){a=[...new Set(a)].sort();if(a.length===2&&a[0].slice(0,7)===a[1].slice(0,7)){const d=x=>+x.slice(8)===1?'1er':+x.slice(8);return `${JOURS[wdOf(a[0])]} ${d(a[0])} et ${JOURS[wdOf(a[1])]} ${d(a[1])} ${MOIS[+a[1].slice(5,7)-1]} ${a[1].slice(0,4)}`}return a.map(frDate).join(' et ')}
function shortCode(c){
 const sc=c.code.slice(2);
 const dup=CLS.some(x=>x!==c&&x.code===c.code);
 return (isWest(c)?'加西':'')+sc+(dup&&isIntl(c)?' 国际':'');
}
function tFor(c,d,home){

 if(home){const a=L.filter(t=>!t.zh);return a.length?a:L}
 let a=tOfDay(c,wdOf(d),d);
 return a.length?a:L;
}

function examList(){

 for(const c of CLS){const I=info(c);for(const s of I.S){
  if(s.mid) L.push({id:`${c.id}|${s.k}|mid`,c,s,type:'mid',dates:[s.mid],home:s.midHome});
  if(s.fin.length) L.push({id:`${c.id}|${s.k}|fin`,c,s,type:'fin',dates:s.fin.slice()});
 }}
 return L.sort((a,b)=>a.dates[0]<b.dates[0]?-1:a.dates[0]>b.dates[0]?1:0);
}
function exName(e){

function exDays(e){

function buildMail(e){

 const ds=exDays(e); const ts=[...new Map(ds.flatMap(x=>x.t).map(t=>[t.id,t])).values()];
 const names=ts.map(t=>t.n).join(' et ');
 const lastD=e.dates[e.dates.length-1];
 const actual={A1:'A1',P1:'Phase 1',A2:'A2',P2:'Phase 2'}[e.s.k]||'';
 const dayFor=sk=>{const hit=ds.filter(x=>!x.lab||sk.split('+').some(p=>x.lab.includes(p)));return frDates((hit.length?hit:ds).map(x=>x.d))};
 for(const p of ps){
  for(let i=0;i<p.length;i++){const sg=p[i];let t=sg[0];
   t=t.replace(/班級名稱/g,label).replace(/班級/g,label);
   t=t.replace(/A1 mid\s+or Phase 1 mid\s*/,actual+' mid').replace(/A2 Mid\s+or Phase 2 Midl?\s*/,actual+' Mid');

  }

function parseCSV(t){const out=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f=''}else f+=ch}if(f!==''||row.length){row.push(f);out.push(row)}const h=out.shift()||[];return out.filter(r=>r.some(x=>x)).map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),(r[i]||'').trim()])))}
function applyLeave(rows,silent){
 CFG.leaveLog=CFG.leaveLog||[];const seen=new Set(CFG.leaveLog.map(x=>x.id));let nOff=0,nNew=0,miss=[];
 rows.forEach(r=>{const id=r['编号']||(r['班级']+'|'+r['日期']+'|'+r['类型']+'|'+r['请假老师']);if(seen.has(id))return;seen.add(id);nNew++;
  const d0=normDate(String(r['日期']||''));if(!d0)return;const d1=normDate(String(r['结束日期']||''))||d0;
  const code=String(r['班级']||'').replace(/\s/g,'');const cs=CLS.filter(c=>c.code===code||c.code.endsWith(code)||shortCode(c).replace(/\s/g,'')===code);
  const shift=r['类型']==='全班停课'||(r['类型']==='老师请假'&&r['有无代课']!=='是');
  const added=[];
  cs.forEach(c=>{if(!shift)return;const {wd}=cdays(c);for(let d=d0;d<=d1;d=addD(d,1)){if(wd.has(wdOf(d))&&!(c.off||[]).includes(d)){c.off=[...(c.off||[]),d].sort();added.push(d);nOff++}}});
  if(!cs.length)miss.push(code);
  CFG.leaveLog.push({id,date:d0,to:d1,code,kind:r['类型'],t:r['请假老师']||'',sub:r['有无代课']==='是'?(r['代课老师']||'是'):'',hrs:r['实际时数']||'',mk:r['是否补课']||'',note:r['原因／备注']||'',who:r['填表人']||'',shift,added});
 });
 if(silent){if(nNew){save();render()}return}
 save();render();
 alert(`新增 ${nNew} 笔登记；${nOff} 个上课日改为停课（课程自动顺延）。`+(miss.length?`\n找不到的班级：${[...new Set(miss)].join('、')}`:''));
}

function payData(ym){
 if(payInit())save();
 const m0=ym+'-01',m1=addD(addD(m0,32).slice(0,8)+'01',-1);

     if(i>=0)ts[i]=Object.assign({},sub,{zh:ts[i].zh});else ts.push(sub);note.push(`${l.sub} 代 ${l.t||'?'}`)}

   });

   const multi=ts.length>1&&!c.tch.some(t=>t.sk);
   ts.forEach(t=>R.push({d,code:shortCode(c),c,stage:s.n,ex:x.m||'',t,h,tm:sessT(c,d),note:note.join('；')+(multi?'同一天排了 '+ts.length+' 位老师，请确认':'')}));

 });
 const holE=new Set(CFG.hol),holW=new Set([...CFG.hol,...CFG.holW]);
 (CFG.priv||[]).forEach(p=>{for(let d=p.from>m0?p.from:m0;d<=m1&&(!p.to||d<=p.to);d=addD(d,1)){if(!(p.d||[]).includes(wdOf(d))||(p.west?holW:holE).has(d))continue;
  R.push({d,code:'私教',c:null,stage:p.name||'私教',ex:'',t:{id:'pv',n:p.t,zh:false},h:+(p.h||tmH(p.tm)||2),tm:p.tm||'',note:'',pv:1})}});
 (CFG.payAdj||[]).filter(a=>a.d>=m0&&a.d<=m1).forEach(a=>{
  const hit=a.kind==='set'?R.find(r=>r.d===a.d&&r.t.n===a.t&&(!a.code||r.code.replace(/\s/g,'')===a.code.replace(/\s/g,'')||(a.code==='私教'&&r.pv))):null;

  else R.push({d:a.d,code:a.code||'',c:null,stage:a.kind==='set'?'':'特殊',ex:'',t:{id:'adj',n:a.t,zh:false},h:+a.h,tm:'',note:a.note||'',adj:1});
 });
 R.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.tm<b.tm?-1:1);
 const half=d=>+d.slice(8)<=15?0:1;

 Object.values(T).forEach(o=>o.cyc=cycOf(o.n));

 <button class="btn sm" style="margin-top:6px" onclick="pvAdd()">＋ 添加私教课</button></div>`;
 return `<div class="card noprint"><div class="row" style="justify-content:space-between"><div class="row"><h2 style="margin:0">老师月历</h2><input type="month" value="${PM}" onchange="PM=this.value||TODAY_M();PT='';render()"></div><button class="btn pri" onclick="payXlsx()">下载 Excel（每位老师一页）</button></div>
 <p class="note">依班级排课＋私教课＋特殊事件计算。已扣掉假日、「登记停课/请假」里的停课和没人代课的请假；有人代课的算给代课老师。双周的老师看「1–15」「16–月底」两栏，月结的看「全月」。</p>
 ${P_.gaps.length?`<div class="warnbox">以下班级在工具里是从这个月中才开始记录，之前的课要另外看：${P_.gaps.map(g=>esc(shortCode(g.c))+'（'+md(g.from)+' 前）').join('、')}</div>`:''}
 <div class="tw"><table><tr><th>老师</th><th>结算</th><th>班级</th><th>1–15</th><th>16–${last}</th><th>全月</th><th></th></tr>${sum}<tr><td colspan="3"><b>合计</b></td><td style="text-align:right">${tot(0)}</td><td style="text-align:right">${tot(1)}</td><td style="text-align:right"><b>${tot()}</b></td><td></td></tr></table></div></div>${det}${adjBox}${pvBox}`;
}
function addAdj(){const g=k=>document.getElementById('aj_'+k).value.trim();const a={id:'aj'+Date.now().toString(36),d:g('d'),t:g('t'),code:g('c'),kind:g('k'),h:+g('h'),note:g('n')};
 if(!a.d||!a.t||document.getElementById('aj_h').value===''){alert('请填日期、老师、时数');return}CFG.payAdj=[...(CFG.payAdj||[]),a];save();render()}
function delAdj(id){CFG.payAdj=(CFG.payAdj||[]).filter(a=>a.id!==id);save();render()}
function pvSet(i,k,v){const p=CFG.priv[i];if(k==='d')v=[...new Set([...v].map(ch=>CN.indexOf(ch)).filter(x=>x>=0))].sort();if(k==='tm'){const h=tmH(v);if(!h&&v){const n=parseFloat(v);if(n){p.h=n;v=''}}else delete p.h}p[k]=v;save();render()}
function pvAdd(){CFG.priv=[...(CFG.priv||[]),{id:'pv'+Date.now().toString(36),name:'',t:'',d:[],tm:'',from:TODAY,to:''}];save();render()}
function pvDel(i){if(!confirm('删除这门私教课？'))return;CFG.priv.splice(i,1);save();render()}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('无法载入 Excel 元件'));document.head.appendChild(s)})}
async function payXlsx(){
 try{await loadXLSX()}catch(e){alert(e.message);return}
 const P_=payData(PM);const wb=XLSX.utils.book_new();const last=+P_.m1.slice(8);
 const s0=[['老师','结算','班级',`1–15 日`,`16–${last} 日`,'全月'],...P_.T.map(x=>[x.n,x.cyc,[...x.cls].join('、'),f2(x.hh[0]),f2(x.hh[1]),f2(x.h)])];
 if(P_.gaps.length)s0.push([],['注意：以下班级在工具里从这个月中才开始记录，之前的课要另外看'],...P_.gaps.map(g=>[shortCode(g.c),md(g.from)+' 前']));
 const ws0=XLSX.utils.aoa_to_sheet(s0);ws0['!cols']=[{wch:16},{wch:7},{wch:40},{wch:8},{wch:8},{wch:8}];XLSX.utils.book_append_sheet(wb,ws0,'汇总');
 const used=new Set(['汇总']);const row=r=>[r.d,CN[wdOf(r.d)],r.code,r.stage,r.ex,r.tm,r.h,r.note];
 P_.T.forEach(x=>{let nm=x.n.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28)||'老师';while(used.has(nm))nm+='_';used.add(nm);
  const A=x.rows.filter(r=>+r.d.slice(8)<=15),B=x.rows.filter(r=>+r.d.slice(8)>15);
  const a=[[x.n+'（'+x.cyc+'）'],['日期','星期','班级','阶段','考试','时间','时数','备注'],...A.map(row),['','','','','','1–15 小计',f2(x.hh[0]),''],...B.map(row),['','','','','',`16–${last} 小计`,f2(x.hh[1]),''],['','','','','','全月合计',f2(x.h),'']];
  const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=[{wch:11},{wch:4},{wch:12},{wch:14},{wch:6},{wch:12},{wch:7},{wch:30}];XLSX.utils.book_append_sheet(wb,ws,nm)});
 XLSX.writeFile(wb,`MLI老师月历_${PM}.xlsx`);
}
function vSet(){
 const ks=Object.keys(DEF_CFG.st);
 return `<div class="card"><h2>每阶段课次与考试位置</h2><p class="note">改了之后所有班级会重新计算。期中＝第几次课；期末＝最后几次课（CLB 与 Phase 3 的 6 小时期末占最后 2 次）。</p><div class="tw"><table><tr><th>阶段</th><th>课次</th><th>期中在第几次（0=无）</th><th>期末占最后几次</th><th>受“9 月起无期中”规则影响</th></tr>
 ${ks.map(k=>{const s=CFG.st[k];return `<tr><td><span class="tag st" style="background:${color(k)}">${s.n}</span></td><td><input type="number" min="1" style="width:70px" value="${s.s}" onchange="CFG.st['${k}'].s=+this.value||1;save()"></td><td><input type="number" min="0" style="width:70px" value="${s.mid}" onchange="CFG.st['${k}'].mid=+this.value||0;save()"></td><td><input type="number" min="0" style="width:70px" value="${s.fin}" onchange="CFG.st['${k}'].fin=+this.value||0;save()"></td><td>${s.noMid?'是':'—'}</td></tr>`}).join('')}</table></div>
 <div class="row" style="margin-top:10px"><label class="f">新制 A2 课次<input type="number" min="1" style="width:90px" value="${CFG.st.A2.sNew||37}" onchange="CFG.st.A2.sNew=+this.value||37;save()"></label></div>
 <div class="row" style="margin-top:10px"><label class="f">此日期起开班的中国班用新制：A1、A2 没有期中，A2 改 37 堂，没有 CLB5 语法<input type="date" value="${CFG.noMidFrom}" onchange="CFG.noMidFrom=this.value;save()"></label></div></div>
 <div class="card"><h2>假期（全部班级跳过）</h2><textarea id="hol">${CFG.hol.join('\n')}</textarea>
 <h2 style="margin-top:12px">加西额外假期（只有加西班跳过）</h2><textarea id="holW" style="min-height:70px">${CFG.holW.join('\n')}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn pri" onclick="saveHol()">保存假期</button></div></div>
 <div class="card"><h2>老师邮箱（考试统计与邮件用）</h2><p class="note">来自考试统计文档；改了自动保存。</p>
 <div class="tw"><table><tr><th>老师</th><th>邮箱</th></tr>${tchAll().map(([id,n])=>`<tr><td>${esc(n)}</td><td><input style="width:300px;max-width:70vw" value="${esc(CFG.mail[id]||'')}" onchange="if(this.value.trim())CFG.mail['${id}']=this.value.trim();else delete CFG.mail['${id}'];save()"></td></tr>`).join('')}</table></div>
</div>
 <div class="card"><h2>共用资料</h2><p class="note">大家打开同一个网址看到的是同一份资料，任何人修改都会自动存到共用版。两个人同时改的话，后存的人会先载入最新版再改一次，不会互相覆盖。老师信箱不会上传，只存在各自这台电脑（「老师邮箱」那栏）。</p>
 <div class="row"><button class="btn" onclick="pushState()">立刻存一次</button><span>${SHARE}</span></div>
 <div class="row" style="margin-top:10px"><label class="f">老师信箱密码（信箱存在 MLI Class 试算表，输对密码才会载入；这台电脑会记住）<input id="mpass" type="password" value="${esc(MPASS)}"></label><button class="btn pri" onclick="setMailPass()">载入信箱</button><span class="note">已载入 ${Object.keys(CFG.mail||{}).length} 位</span></div></div>
 <div class="card"><h2>停课／请假登记表</h2><p class="note">同事在登记页送出后，会写进 Google 试算表、Google 文件并寄信通知。这里按「同步」就会把「全班停课」和「老师请假且没人代课」的日期加进该班的停课日，后面的课自动顺延；有人代课的只记录，不影响课表。</p>
 <div class="row"><label class="f" style="flex:1;min-width:260px">Apps Script 网址<input value="${esc(CFG.leaveApi||'')}" placeholder="https://script.google.com/macros/s/…/exec" onchange="CFG.leaveApi=this.value.trim();save()"></label></div>
 <div class="row"><button class="btn pri" onclick="syncLeave()">同步登记表</button><label class="btn">导入 CSV<input type="file" accept=".csv" style="display:none" onchange="importLeaveCSV(this)"></label><span class="note">已同步 ${(CFG.leaveLog||[]).length} 笔</span></div></div>
 <div class="card"><h2>资料</h2><p class="note">资料存在这台电脑的浏览器里。换电脑或备份时请先导出。</p><div class="row">
 <button class="btn" onclick="exportJ()">导出备份（JSON）</button><label class="btn">导入备份<input type="file" accept=".json" style="display:none" onchange="importJ(this)"></label>
 <button class="btn" onclick="exportCSV()">导出班级表（CSV）</button>
 <button class="btn" onclick="if(confirm('改回 10/13 课表的班级与默认设定？你自己加的班会消失。')){try{localStorage.removeItem(SKEY)}catch(e){};load();render()}">恢复为 10/13 课表</button></div></div>`;
}
function tchAll(){const m=new Map();CLS.forEach(c=>c.tch.forEach(t=>m.set(t.id,t.n)));Object.keys(CFG.mail).forEach(id=>{if(!m.has(id))m.set(id,MAILSEED.names[id]||id)});return [...m.entries()].sort((a,b)=>a[1].localeCompare(b[1]))}
function saveHol(){const rd=id=>document.getElementById(id).value.split(/\s+/).map(s=>normDate(s)).filter(Boolean).sort();CFG.hol=[...new Set(rd('hol'))];CFG.holW=[...new Set(rd('holW'))];save();render();alert('已保存')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportJ(){dl('MLI班级管理备份_'+TODAY+'.json',JSON.stringify({cfg:CFG,cls:CLS,ex:EX,ver:SEED_VER},null,1),'application/json')}
function importJ(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.cls)throw 0;CFG=o.cfg||CFG;CLS=o.cls;EX=o.ex||EX;save();render();alert('已导入 '+CLS.length+' 个班')}catch(e){alert('文件格式不对')}})}
function exportCSV(){
 const H=['班号','类型','形式','上课日','外教日','状态','当前阶段','本阶段开始','本阶段结束','期中','期末','下一阶段','下一阶段开始','全程结课','老师'];
 const r=CLS.map(c=>{const I=info(c),s=I.cur||{};return [c.code,c.cat,c.ft?'全日':'兼读',wdStr(c.wd),wdStr(c.fr||[]),I.st,s.n||'',s.start||'',s.end||'',s.mid?midStr(s):'',(s.fin||[]).join(' / '),I.nxt?I.nxt.n:'',I.nxt?I.nxt.start:'',I.last?I.last.end:'',c.tch.map(t=>t.n).join(' / ')]});
 dl('MLI班级_'+TODAY+'.csv','﻿'+[H,...r].map(a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
load();nav();render();boot();
</script>
</body>
