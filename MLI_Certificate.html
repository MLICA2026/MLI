<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLI 结业文件生成器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --blue:#29BAEE; --green:#60BB86; --teal:#38B9B0;
  --ink:#1F2A30; --muted:#5E6E77; --line:#D5E0E5; --panel:#F4F8FA;
  --fill-manual:#E3F6FD; --fill-manual-b:#9ADCF4;
  --fill-choice:#FFF6C7; --fill-choice-b:#E9CF5C;
  --warn:#B4420F; --warn-bg:#FFF1EA;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:var(--ink);background:#E9EFF2;font-size:14px}
.app{display:grid;grid-template-columns:minmax(360px,440px) 1fr;height:100vh}
.form{background:#fff;border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.brandbar{display:flex;height:5px}
.brandbar i{flex:1}
.brandbar i:nth-child(1){background:var(--green)} .brandbar i:nth-child(2){background:var(--blue)} .brandbar i:nth-child(3){background:var(--teal)}
header.top{padding:18px 22px 10px}
header.top h1{font-size:19px;margin:0 0 4px;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.sw.m{background:var(--fill-manual);border:1px solid var(--fill-manual-b)}
.sw.c{background:var(--fill-choice);border:1px solid var(--fill-choice-b)}
section{padding:14px 22px;border-top:1px solid var(--line)}
section h2{font-size:14px;margin:0 0 10px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f small{color:#8A99A1;font-size:11px}
input,select{font:inherit;font-size:14px;color:var(--ink);padding:7px 9px;border-radius:6px;width:100%;min-width:0}
input.m{background:var(--fill-manual);border:1px solid var(--fill-manual-b)}
select.c,input.c{background:var(--fill-choice);border:1px solid var(--fill-choice-b)}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
input.bad{border-color:var(--warn);background:var(--warn-bg)}
.seg{display:flex;border:1px solid var(--fill-choice-b);border-radius:6px;overflow:hidden;background:var(--fill-choice)}
.seg label{flex:1;text-align:center;padding:7px 4px;cursor:pointer;font-size:14px;color:var(--ink)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:#F2D65A;font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:-2px}
.autodates{font-size:12px;color:var(--muted)}
.autodates div{margin-top:4px;padding:8px 10px;border-radius:6px;background:var(--panel);border:1px dashed var(--line);font-size:14px;color:var(--ink)}
.segf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:none;color:#0B7FA8;font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.stage{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--panel)}
.stage-head{display:flex;gap:8px;align-items:end;margin-bottom:8px}
.stage-head label.f{flex:0 0 110px}
.stage-head .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;color:var(--muted);font-size:12px}
.stage-head .x:hover{color:var(--warn);border-color:var(--warn)}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scores input,.pres input{text-align:center}
.pres{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 74px;gap:6px;margin-top:6px}
.btn{font:inherit;border-radius:7px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.add{width:100%;border-style:dashed;color:#0B7FA8}
.btn.add:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;width:100%;padding:12px}
.btn.primary:disabled{opacity:.6;cursor:wait}
.check{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.check input{width:auto}
.warns{margin:0;padding:10px 12px 10px 28px;background:var(--warn-bg);border:1px solid #F3C4AC;border-radius:7px;color:var(--warn);font-size:12.5px;line-height:1.55}
.warns:empty{display:none}
.status{font-size:12.5px;color:var(--muted);min-height:18px;margin-top:8px}
.preview{overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:22px}
.pv-label{align-self:stretch;font-size:12px;color:var(--muted);margin-bottom:-14px}
.pv{position:relative;box-shadow:0 1px 3px rgba(20,40,50,.18),0 6px 18px rgba(20,40,50,.08);background:#fff}
#capture{position:fixed;left:-30000px;top:0}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.form{border-right:none}}

/* ===== Document pages ===== */
.page{position:relative;background:#fff;overflow:hidden;color:#000}
.page .a{position:absolute}
.land{width:792pt;height:612pt}
.port{width:612pt;height:792pt}
.bar{display:flex}
.bar i{display:block;height:100%}
.g{background:#60BB86}.b{background:#29BAEE}.t{background:#38B9B0}
.ph{color:#B8C3C8}
/* p1 */
.p1{font-family:Arial,"Liberation Sans",Helvetica,sans-serif}
.p1 .body{left:56pt;top:250pt;width:680pt;font-size:17pt;line-height:32pt;text-align:justify;text-indent:44pt}
.p1 .lead{left:0;width:792pt;top:212pt;text-align:center;font-size:17pt}
.p1 .date{left:506pt;width:210pt;top:398pt;text-align:center;font-size:17pt}
.p1 .foot{top:494pt;left:139pt;font-size:11.5pt;white-space:pre}
/* p2 */
.p2{font-family:Arial,"Liberation Sans",Helvetica,sans-serif;font-size:9pt}
.p2 .ttl{left:53pt;width:488pt;top:166pt;text-align:center;font-weight:700;font-size:21pt}
.p2 .blk{left:53pt;width:488pt}
.p2 .blk p{margin:0}
.p2 b{font-weight:700}
.p2 .ft{left:0;width:612pt;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:8pt}
/* p3 */
.p3{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:9pt}
.p3 .hdr{left:52pt;font-weight:700;font-size:10pt;line-height:12pt}
.p3 .ttl{left:0;width:612pt;top:182pt;text-align:center;font-weight:700;font-size:12.5pt}
.p3 .rblk{left:53pt;width:506pt;height:53pt;border-top:.8pt solid #000}
.p3 .rblk .c{position:absolute;white-space:nowrap}
.p3 .sk{font-weight:700;font-size:6.8pt;text-align:center;width:81pt}
.p3 .num{text-align:center;width:81pt}
.p3 .ft{font-family:Georgia,"Times New Roman",serif;font-size:8pt}
</style>
</head>
<body>
<div class="app">
  <div class="form">
    <div class="brandbar"><i></i><i></i><i></i></div>
    <header class="top">
      <h1>结业文件生成器</h1>
      <div style="font-size:12.5px;color:var(--muted)">Diplôme · Attestation d'études · Rapport académique，一次输出一份 PDF</div>
      <div class="legend"><span><i class="sw m"></i>手动填写</span><span><i class="sw c"></i>选项</span></div>
    </header>

    <section>
      <h2>学生资料</h2>
      <div class="grid">
        <label class="f">Nom de famille（姓）<input class="m" id="nom" autocomplete="off"></label>
        <label class="f">Prénom（名）<input class="m" id="prenom" autocomplete="off"></label>
        <label class="f">学号<input class="m" id="sid" autocomplete="off"></label>
        <div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)">性别
          <div class="seg" role="radiogroup" aria-label="性别">
            <label><input type="radio" name="gender" value="m" checked>男</label>
            <label><input type="radio" name="gender" value="f">女</label>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>课程与证明</h2>
      <div class="grid">
        <label class="f">Programme
          <select class="c" id="prog">
            <option>NCLC 4</option><option selected>NCLC 5</option><option>NCLC 7</option><option value="__other">其他（自填）</option>
          </select>
        </label>
        <label class="f">注册方式
          <select class="c" id="mode">
            <option value="ft">Full time</option><option value="pt">Part time</option><option value="both">Both</option>
          </select>
        </label>
        <div class="f segf">状态
          <div class="seg" role="radiogroup" aria-label="状态">
            <label><input type="radio" name="status" value="done" checked>已完成</label>
            <label><input type="radio" name="status" value="ongoing">在读中</label>
          </div>
        </div>
        <div class="f segf">授课方式
          <div class="seg" role="radiogroup" aria-label="授课方式">
            <label><input type="radio" name="delivery" value="onsite" checked>面授</label>
            <label><input type="radio" name="delivery" value="online">线上</label>
          </div>
        </div>
        <label class="f full" id="progOtherWrap" hidden>自填课程名称<input class="m" id="progOther"></label>
        <div class="full autodates">在读期间（依成绩单自动带入）<div id="autoRange">—</div></div>
        <label class="f">开立日期<input class="m" type="date" id="issue"></label>
      </div>
    </section>

    <section>
      <h2>成绩单阶段 <span style="font-weight:400;font-size:12px;color:var(--muted)" id="stageCount"></span></h2>
      <div id="stages"></div>
      <button type="button" class="btn add" id="addStage">新增阶段</button>
      <label class="check"><input type="checkbox" id="padEmpty" checked>其余空白栏保留（共 8 格，同原模板）</label>
    </section>

    <section style="padding-bottom:26px">
      <h2>输出</h2>
      <label class="check"><input type="checkbox" id="inc1" checked>Diplôme（证书）</label>
      <label class="check"><input type="checkbox" id="inc2" checked>Attestation d'études（在读证明）</label>
      <label class="check"><input type="checkbox" id="inc3" checked>Rapport académique（成绩单）</label>
      <ul class="warns" id="warns"></ul>
      <div style="height:10px"></div>
      <button type="button" class="btn primary" id="gen">生成 PDF</button>
      <div class="status" id="status" aria-live="polite"></div>
    </section>
  </div>

  <div class="preview" id="preview"></div>
</div>
<div id="capture" aria-hidden="true"></div>

const MAX_STAGES = 8;
const $ = id => document.getElementById(id);
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseD(v){ if(!v) return null; const [y,m,d]=v.split('-').map(Number); return {y,m,d}; }
function frLong(v){ const p=parseD(v); if(!p) return ''; return (p.d===1?'1er':p.d)+' '+MOIS[p.m-1]+' '+p.y; }
function dmy(v){ const p=parseD(v); if(!p) return ''; return String(p.d).padStart(2,'0')+'-'+String(p.m).padStart(2,'0')+'-'+p.y; }
function ph(label){ return '<span class="ph">'+esc(label)+'</span>'; }
function val(v,label){ return v ? esc(v) : ph(label); }

/* ---------- stages ---------- */
let stages = [];
let uid = 0;
function newStage(level=''){ return {id:++uid, level, co:'', eo:'', ce:'', ee:'', from:'', to:'', pres:''}; }
stages = ['A1','A2','NCLC 5','NCLC 6','NCLC 7'].map(l=>newStage(l));

function renderStageForm(){
  const box = $('stages');
  box.innerHTML = stages.map((s,i)=>`
    <div class="stage" data-id="${s.id}">
      <div class="stage-head">
        <label class="f">Niveau<input class="m" list="lvlList" data-k="level" value="${esc(s.level)}"></label>
        <span style="font-size:12px;color:var(--muted);padding-bottom:9px">阶段 ${i+1}</span>
        <button type="button" class="x" data-del="${s.id}" aria-label="删除阶段 ${i+1}">删除</button>
      </div>
      <div class="scores">

        <label class="f">写作 EE<input class="m" inputmode="decimal" data-k="ee" value="${esc(s.ee)}"></label>

}
$('stages').addEventListener('input', e=>{
  const k = e.target.dataset.k; if(!k) return;
  const id = +e.target.closest('.stage').dataset.id;
  const s = stages.find(x=>x.id===id); s[k] = e.target.value.trim();
  update();
});
$('stages').addEventListener('click', e=>{
  const id = e.target.dataset.del; if(!id) return;
  stages = stages.filter(s=>s.id!==+id); renderStageForm(); update();
});
$('addStage').addEventListener('click', ()=>{
  if(stages.length>=MAX_STAGES) return;
  stages.push(newStage()); renderStageForm(); update();
  const inputs = $('stages').querySelectorAll('.stage:last-child input'); inputs[0] && inputs[0].focus();
});

function stageRange(){
  const froms = stages.map(s=>s.from).filter(Boolean).sort();
  const tos = stages.map(s=>s.to).filter(Boolean).sort();
  return {start: froms[0]||'', end: tos[tos.length-1]||''};
}

/* ---------- state ---------- */

  return {
    nom: $('nom').value.trim(), prenom: $('prenom').value.trim(), sid: $('sid').value.trim(),
    f: g==='f',
    prog: progSel==='__other' ? $('progOther').value.trim() : progSel,
    mode: $('mode').value,
    ongoing: document.querySelector('input[name=status]:checked').value==='ongoing',
    online: document.querySelector('input[name=delivery]:checked').value==='online',
    start: stageRange().start, end: stageRange().end, issue: $('issue').value,
    pad: $('padEmpty').checked,
    inc: [$('inc1').checked, $('inc2').checked, $('inc3').checked]

}

/* ---------- validation ---------- */
function validate(s){
  const w=[];
  const req=[['nom','姓'],['prenom','名'],['sid','学号'],['issue','开立日期']];
  document.querySelectorAll('.form input.bad').forEach(el=>el.classList.remove('bad'));
  const miss=req.filter(([k])=>!s[k]);
  miss.forEach(([k])=>$(k).classList.add('bad'));
  if(miss.length) w.push('未填：'+miss.map(x=>x[1]).join('、'));
  if(!s.prog) w.push('未填：课程名称');
  if(!s.ongoing && s.issue && s.end && s.issue < s.end) w.push('开立日期早于课程结束日期（若学生还在读，状态请选“在读中”）');
  if(s.ongoing && s.inc[0]) w.push('状态为在读中，但仍勾选了 Diplôme（证书）');
  stages.forEach((r,i)=>{
    const n='阶段 '+(i+1)+(r.level?'（'+r.level+'）':'');
    const el=k=>document.querySelector(`.stage[data-id="${r.id}"] [data-k="${k}"]`);
    if(!r.level){ w.push(n+'：未填 Niveau'); el('level').classList.add('bad'); }
    ['co','eo','ce','ee'].forEach(k=>{
      const v=r[k];
      if(v==='') { if(!s.ongoing) el(k).classList.add('bad'); return; }
      const x=Number(v); if(isNaN(x)||x<0||x>100){ w.push(n+'：分数“'+v+'”不在 0–100'); el(k).classList.add('bad'); }
    });
    if(!s.ongoing && ['co','eo','ce','ee'].some(k=>r[k]==='')) w.push(n+'：分数未填齐');
    const p=r.pres.replace(/%$/,'');
    if(p===''){ if(!s.ongoing){ w.push(n+'：未填出勤率'); el('pres').classList.add('bad'); } }
    else { const x=Number(p); if(isNaN(x)||x<0||x>100){ w.push(n+'：出勤率“'+r.pres+'”不在 0–100'); el('pres').classList.add('bad'); } }
    if(!r.from||(!r.to&&!s.ongoing)){ w.push(n+'：日期未填齐'); if(!r.from)el('from').classList.add('bad'); if(!r.to&&!s.ongoing)el('to').classList.add('bad'); }
    else if(r.to && r.from>r.to){ w.push(n+'：开始晚于结束'); el('from').classList.add('bad'); }
  });
  if(!stages.length) w.push('成绩单没有任何阶段');
  return w;
}

/* ---------- preview ---------- */
const PT = 96/72;
function update(){
  const s = state();
  const pages = [[page1,792,612,'Diplôme'],[page2,612,792,"Attestation d'études"],[page3,612,792,'Rapport académique']];
  const pv = $('preview');
  const avail = Math.max(280, pv.clientWidth - 48);
  pv.innerHTML = pages.map(([fn,w,h,lbl],i)=>{
    if(!s.inc[i]) return '';
    const W=w*PT, H=h*PT, k=Math.min(1, (i===0?avail:avail*0.78)/W);
    return `<div class="pv-label">${lbl}</div><div class="pv" style="width:${W*k}px;height:${H*k}px"><div class="page-wrap" style="transform:scale(${k});transform-origin:0 0;width:${W}px;height:${H}px">${fn(s)}</div></div>`;
  }).join('') || '<div style="color:var(--muted);margin-top:40px">请至少勾选一份文件</div>';
  $('autoRange').textContent = (s.start||s.end) ? (s.ongoing ? (dmy(s.start)||'?')+'  →  在读中' : (dmy(s.start)||'?')+'  →  '+(dmy(s.end)||'?')) : '填入成绩单各阶段日期后自动显示';
  const w = validate(s);
  $('warns').innerHTML = w.map(x=>'<li>'+esc(x)+'</li>').join('');
}

/* ---------- PDF ---------- */
async function waitImages(root){
  await Promise.all([...root.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r;})));
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
}
async function generate(){
  const s = state();
  const w = validate(s);
  if(!s.inc.some(Boolean)){ $('status').textContent='请至少勾选一份文件。'; return; }
  if(w.length && !confirm('以下项目需要确认：\n\n'+w.join('\n')+'\n\n仍要生成 PDF？')) return;
  if(!window.jspdf || !window.html2canvas){ $('status').textContent='PDF 组件加载失败：请确认网络连接后刷新页面。'; return; }
  const btn=$('gen'); btn.disabled=true; $('status').textContent='生成中…';
  try{
    const defs=[[page1,'l'],[page2,'p'],[page3,'p']].filter((_,i)=>s.inc[i]);
    const {jsPDF} = window.jspdf;
    let pdf=null;
    const cap=$('capture');
    for(let i=0;i<defs.length;i++){
      const [fn,o]=defs[i];
      cap.innerHTML = fn(s).replace(/<span class="ph">([\s\S]*?)<\/span>/g,'');
      const el = cap.firstElementChild;
      await waitImages(cap);
      const canvas = await html2canvas(el,{scale:3,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const data = canvas.toDataURL('image/jpeg',0.92);
      const W = o==='l'?792:612, H = o==='l'?612:792;
      if(!pdf) pdf = new jsPDF({unit:'pt',format:'letter',orientation:o==='l'?'landscape':'portrait',compress:true});
      else pdf.addPage('letter', o==='l'?'landscape':'portrait');
      pdf.addImage(data,'JPEG',0,0,W,H,undefined,'FAST');
    }
    cap.innerHTML='';
    const safe = x=>x.replace(/[\\/:*?"<>|]+/g,'').trim();
    const nm = safe(fullName(s)) || '学生姓名';
    const fname = `${nm}_Attestation_${s.issue||'开立日期'}.pdf`;
    pdf.save(fname);
    $('status').textContent='已下载：'+fname;
  }catch(err){
    console.error(err);
    $('status').textContent='生成失败：'+err.message;
  }finally{ btn.disabled=false; }
}

/* ---------- init ---------- */
(function init(){
  const t=new Date(); const pad=n=>String(n).padStart(2,'0');
  $('issue').value = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  renderStageForm();
  document.querySelector('.form').addEventListener('input', e=>{ if(!e.target.dataset.k) update(); });
  document.querySelector('.form').addEventListener('change', e=>{ if(!e.target.dataset.k) update(); });
  $('gen').addEventListener('click', generate);
  document.querySelectorAll('input[name=status]').forEach(r=>r.addEventListener('change',()=>{ $('inc1').checked = r.value==='done' ? true : false; update(); }));
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(update,120);});
  update();
})();
</script>
