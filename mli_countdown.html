<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compte à rebours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#2DB8EE; --leaf:#66BB88; --teal:#3AB8A8; --maple:#D2352B; --wood:#6B3F26;
  --bg:#EEF7FA; --surface:#FFFFFF; --ink:#33424B; --muted:#6C7C86; --line:#D5E6EC;
  --digit:#33424B; --track:#DCEBF0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10202A; --surface:#172C38; --ink:#E4EEF2; --muted:#9DB0BA; --line:#27414F;
    --digit:#F2F7F9; --track:#23404E;
  }
}
:root[data-theme="dark"]{
  --bg:#10202A; --surface:#172C38; --ink:#E4EEF2; --muted:#9DB0BA; --line:#27414F;
  --digit:#F2F7F9; --track:#23404E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;flex-direction:column;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(14px,3vw,32px)}
.logo{background:#fff;border-radius:10px;padding:6px 12px;display:flex;align-items:center}
.logo img{height:clamp(30px,4.5vw,44px);width:auto;display:block}
.top-actions{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;display:flex;align-items:center;gap:6px}
.icon-btn:hover{border-color:var(--sky)}

/* stage */
.stage{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center;gap:clamp(12px,3vw,48px);padding:8px clamp(14px,4vw,56px) 12px;max-width:1400px;width:100%;margin:0 auto}
.mascot-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.bubble{
  position:relative;background:var(--surface);border:3px solid var(--wood);border-radius:22px;
  padding:10px 20px;font-weight:700;font-size:clamp(1rem,2vw,1.45rem);margin-bottom:14px;
  min-height:1.6em;text-align:center;max-width:90%;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%) rotate(45deg);width:20px;height:20px;background:var(--surface);border-right:3px solid var(--wood);border-bottom:3px solid var(--wood)}
.mascot{height:clamp(220px,46vh,460px);width:auto;max-width:100%;display:block;transform-origin:50% 100%;filter:drop-shadow(0 10px 14px rgba(20,60,80,.18))}
.mascot.swap{animation:pop .45s ease-out}
.running .mascot{animation:sway 2.4s ease-in-out infinite}
.done .mascot{animation:hop .5s ease-in-out infinite}
.name{margin-top:10px;font-weight:700;color:var(--muted);font-size:1rem;display:flex;align-items:center;gap:8px}
.name button{border:none;background:none;padding:4px 8px;border-radius:8px;color:var(--sky);font-weight:700}
.name button:hover{background:var(--track)}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mascot,.running .mascot,.done .mascot,.mascot.swap{animation:none!important}}

/* clock */
.clock{display:flex;flex-direction:column;align-items:stretch;gap:clamp(14px,2.4vh,26px)}
.digits{
  font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:800;color:var(--digit);
  font-size:clamp(4rem,13vw,12rem);line-height:.95;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em;
  transition:color .3s;
}
.digits .sep{color:var(--sky);margin:0 .02em}
.urgent .digits{color:var(--maple)}
.done .digits{color:var(--maple);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.done .digits{animation:none}}
.bar{height:18px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--teal) 55%,var(--leaf));transform-origin:left;transition:transform .15s linear}
.urgent .bar i{background:var(--maple)}

.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{border:none;border-radius:16px;padding:14px 30px;font-size:clamp(1rem,1.8vw,1.25rem);font-weight:700;min-width:130px}
.btn-main{background:var(--sky);color:#fff;box-shadow:0 5px 0 #1C8FBC}
.btn-main:active{transform:translateY(3px);box-shadow:0 2px 0 #1C8FBC}
.btn-main.pause{background:#F2A93B;box-shadow:0 5px 0 #C27F1C}
.btn-ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--maple);color:var(--maple)}
.keys{text-align:center;color:var(--muted);font-size:.85rem}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface);font-family:inherit}

/* settings */
.settings{max-width:1400px;width:100%;margin:0 auto;padding:0 clamp(14px,4vw,56px) 22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:14px 20px;align-items:center}
.panel h2{font-size:.95rem;margin:0;color:var(--muted);font-weight:500;white-space:nowrap}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.hms{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}
.hms label{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);gap:3px}
.hms input{width:74px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-family:"Baloo 2",system-ui,sans-serif;font-weight:600;font-size:1.3rem;text-align:center}
.hms span{font-size:1.4rem;font-weight:700;padding-bottom:8px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.row select{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.row label{display:flex;align-items:center;gap:6px}
.row input[type=number]{width:64px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal)}
.test{border:none;background:none;color:var(--sky);font-weight:700;padding:4px 6px}
fieldset{border:none;margin:0;padding:0;min-width:0}
fieldset:disabled{opacity:.5}

/* fullscreen / focus mode */
body.focus .settings,body.focus .keys{display:none}
body.focus .digits{font-size:clamp(5rem,17vw,17rem)}
body.focus .mascot{height:clamp(260px,58vh,620px)}

@media (max-width:760px){
  .stage{grid-template-columns:1fr}
  .mascot{height:clamp(180px,30vh,280px)}
  .panel{grid-template-columns:1fr;gap:8px}
  .panel h2{margin-top:6px}
  .keys{display:none}
}
</style>
</head>

    const t = Math.max(0, Math.ceil(ms/1000));
    const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
    const p = n => String(n).padStart(2,"0");
    return { h, text: (h>0 ? [h,p(m),p(s)] : [p(m),p(s)]) };
  }
  function render(){
    const f = fmt(remainMs);
    digits.innerHTML = f.text.join('<span class="sep">:</span>');
    digits.setAttribute("aria-label", f.text.join(":"));
    const ratio = totalMs>0 ? remainMs/totalMs : 0;
    barFill.style.transform = "scaleX("+Math.max(0,Math.min(1,ratio))+")";
    const secs = Math.ceil(remainMs/1000);
    stage.classList.toggle("urgent", state==="running" && secs<=10 && secs>0);
    document.title = (state==="idle" ? "" : f.text.join(":")+" · ") + "Compte à rebours";
  }
  function setState(s){
    state = s;
    stage.classList.toggle("running", s==="running");
    stage.classList.toggle("done", s==="done");
    setFs.disabled = (s==="running" || s==="paused");
    mainBtn.classList.toggle("pause", s==="running");
    mainBtn.textContent = s==="running" ? "Pause" : s==="paused" ? "Continuer" : "Démarrer";
  }

  /* ---------- inputs ---------- */
  function readInputs(){
    const h=Math.max(0,Math.min(23,parseInt(inH.value)||0));
    const m=Math.max(0,Math.min(59,parseInt(inM.value)||0));
    const s=Math.max(0,Math.min(59,parseInt(inS.value)||0));
    return (h*3600+m*60+s)*1000;
  }
  function writeInputs(ms){
    const t=Math.round(ms/1000);
    inH.value=String(Math.floor(t/3600)).padStart(2,"0");
    inM.value=String(Math.floor(t%3600/60)).padStart(2,"0");
    inS.value=String(t%60).padStart(2,"0");
  }
  function markPreset(){
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", +c.dataset.s*1000===totalMs));
  }
  function applyTotal(ms){
    totalMs = ms; remainMs = ms;
    if(state==="done") setState("idle");
    markPreset(); render(); save();
  }
  [inH,inM,inS].forEach(el=>{
    el.addEventListener("input", ()=>{ if(state==="idle"||state==="done") applyTotal(readInputs()); });
    el.addEventListener("blur", ()=>writeInputs(totalMs));
  });
  const presetBox=$("presets");
  PRESETS.forEach(s=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.dataset.s=s;
    b.textContent = s>=3600 ? (s/3600)+" h" : (s/60)+" min";
    b.addEventListener("click", ()=>{ writeInputs(s*1000); applyTotal(s*1000); });
    presetBox.appendChild(b);
  });

  /* ---------- audio ---------- */
  let ac=null;
  function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==="suspended") ac.resume(); return ac; }
  function tone(freq, start, dur, type, vol){
    const a=ctx(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+start;
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.3,t+.02);
    g.gain.setValueAtTime(vol||.3,t+dur-.04); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
  }
  function siren(start, cycles){
    const a=ctx(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+start;
    o.type="sawtooth";
    for(let i=0;i<cycles;i++){ o.frequency.setValueAtTime(650,t+i*.6); o.frequency.linearRampToValueAtTime(1250,t+i*.6+.3); o.frequency.linearRampToValueAtTime(650,t+i*.6+.6); }
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.03);
    g.gain.setValueAtTime(.16,t+cycles*.6-.05); g.gain.linearRampToValueAtTime(0,t+cycles*.6);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+cycles*.6+.05);
  }
  function playAlarm(kind){
    switch(kind){
      case "short": [0,.25,.5].forEach(s=>tone(1046,s,.15,"square",.18)); break;
      case "long": tone(988,0,1.4,"square",.18); break;
      case "siren": siren(0,4); break;
      case "siren3": siren(0,4); siren(3,4); siren(6,4); break;
    }
  }
  function playWarn(){ if(alarmSel.value==="mute") return; tone(784,0,.12,"sine",.25); tone(1046,.16,.18,"sine",.25); }

  /* ---------- timer ---------- */
  function tick(){
    remainMs = endAt - Date.now();
    const secs = Math.ceil(remainMs/1000);
    if(warnChk.checked && !warned){
      const w = +warnSec.value||10;
      if(secs<=w && totalMs/1000>w){ warned=true; playWarn(); lastSec=-1; }
    }
    if(remainMs<=0){ remainMs=0; finish(); return; }
    if(Date.now()>=introUntil && secs!==lastSec){ lastSec=secs; counting(secs); }
    render();
  }
  function start(){
    if(state==="idle"||state==="done"){
      totalMs = readInputs(); if(totalMs<=0){ inM.focus(); return; }
      remainMs = totalMs; warned=false;
      introUntil = Date.now()+2500;
      show("fa", "C'est parti !");
    }else{
      introUntil = 0;
    }
    lastSec=-1;
    ctx();
    endAt = Date.now()+remainMs;
    setState("running");
    clearInterval(timer); timer=setInterval(tick,100); tick();
  }
  function pause(){
    clearInterval(timer); remainMs = Math.max(0,endAt-Date.now());
    setState("paused"); show("mei", "Une petite pause…"); render();
  }
  function stop(){
    clearInterval(timer); remainMs=totalMs; warned=false;
    setState("idle"); show("fa", "Tout le monde est prêt ?"); render();
  }
  function finish(){
    clearInterval(timer);
    setState("done"); show("en", "Le temps est écoulé !"); render();
    playAlarm(alarmSel.value);
    if(loopChk.checked){
      setTimeout(()=>{ if(state==="done"){ remainMs=totalMs; warned=false; start(); } }, 3000);
    }
  }
  mainBtn.addEventListener("click", ()=> state==="running" ? pause() : start());
  stopBtn.addEventListener("click", stop);
  $("testBtn").addEventListener("click", ()=>playAlarm(alarmSel.value));
  [alarmSel,warnChk,warnSec,loopChk].forEach(el=>el.addEventListener("change",save));

  /* ---------- fullscreen & theme ---------- */
  function toggleFs(){
    const d=document;
    if(!d.fullscreenElement && !d.webkitFullscreenElement){
      const el=d.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
      d.body.classList.add("focus");
    }else{
      (d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);
    }
  }
  function syncFs(){ const on=!!(document.fullscreenElement||document.webkitFullscreenElement); document.body.classList.toggle("focus",on); $("fsBtn").textContent = on ? "⛶ Quitter le plein écran" : "⛶ Plein écran"; }
  document.addEventListener("fullscreenchange",syncFs);
  document.addEventListener("webkitfullscreenchange",syncFs);
  $("fsBtn").addEventListener("click",toggleFs);
  $("themeBtn").addEventListener("click",()=>{
    const r=document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark"; save();
  });

  document.addEventListener("keydown", e=>{
    const tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="select") return;
    if(e.code==="Space"){ e.preventDefault(); state==="running" ? pause() : start(); }
    else if(e.code==="Backspace"){ e.preventDefault(); stop(); }
    else if(e.key==="f"||e.key==="F"){ toggleFs(); }
  });

  /* ---------- init ---------- */
  const saved = store.get();
  if(saved.theme) document.documentElement.dataset.theme = saved.theme;
  totalMs = remainMs = ((saved.total>0 ? saved.total : 300))*1000;
  alarmSel.value = saved.alarm || "short";
  warnChk.checked = !!saved.warn;
  warnSec.value = saved.warnSec || 10;
  loopChk.checked = !!saved.loop;
  writeInputs(totalMs); markPreset();
  setState("idle"); show("fa", "Tout le monde est prêt ?"); render();
})();
</script>
</body>
</html>
