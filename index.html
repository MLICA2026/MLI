<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLI 停课请假登记</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e2dc;--acc:#b4232c;--ok:#1f7a4d}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--card:#212226;--ink:#e8e6e3;--mut:#9aa0a6;--line:#34363b;--acc:#ff6b73;--ok:#6fd19c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.w{max-width:640px;margin:0 auto;padding:20px 16px}header{display:flex;gap:12px;align-items:center;margin-bottom:14px}header img{height:36px}h1{font-size:19px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.hint{font-size:12.5px;color:var(--mut)}.ok{color:var(--ok);font-weight:700}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
</style></head><body><div class="w">

 const x={who:$('who').value.trim(),code:$('code').value,cat:(CLS.find(c=>c.code===$('code').value)||{}).cat||'',date:$('date').value,to:$('to').value,kind:segs.kind,teacher:segs.kind==='全班停课'?'':pick('teacher'),sub:segs.kind==='老师请假'?segs.sub:'',subTeacher:segs.sub==='是'?pick('subTeacher'):'',hours:segs.kind==='只上部分时数'?$('hours').value:'',makeup:segs.makeup,note:$('note').value.trim()};

 if(API.startsWith('__')){$('msg').textContent='尚未设定 API 网址';return}

};
async function load(){if(API.startsWith('__')){$('recent').textContent='尚未设定 API 网址';return}
